version: '3.8'

# Define a custom network to ensure all services can communicate
networks:
  chat-net:
    driver: bridge

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=omaradel
      - POSTGRES_DB=chatdb
    ports:
      - "5432:5432"
    networks:
      - chat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service Instances (Multiple for load balancing)
  api1:
    container_name: api1
    build: .
    depends_on:
      - postgres
      - redis
    networks:
      - chat-net
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=2
      - DATABASE_URL=postgresql://postgres:omaradel@postgres:5432/chatdb
      - REDIS_HOST=redis
      - SECRET_KEY=your_super_secret_key_instance_1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api2:
    container_name: api2
    build: .
    depends_on:
      - postgres
      - redis
    networks:
      - chat-net
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=2
      - DATABASE_URL=postgresql://postgres:omaradel@postgres:5432/chatdb
      - REDIS_HOST=redis
      - SECRET_KEY=your_super_secret_key_instance_2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api3:
    container_name: api3
    build: .
    depends_on:
      - postgres
      - redis
    networks:
      - chat-net
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=2
      - DATABASE_URL=postgresql://postgres:omaradel@postgres:5432/chatdb
      - REDIS_HOST=redis
      - SECRET_KEY=your_super_secret_key_instance_3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Load Balancer
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - chat-net
    depends_on:
      - api1
      - api2
      - api3

  # Prometheus for Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - chat-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - nginx

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - chat-net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:omaradel@postgres:5432/chatdb?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - chat-net
    depends_on:
      - postgres

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - chat-net
    depends_on:
      - redis

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.10.0
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    ports:
      - "9113:9113"
    networks:
      - chat-net
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
