user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # use Docker's internal DNS and re‐resolve every 10s
    resolver 127.0.0.11 ipv6=off valid=10s;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # cache declared in http{} context
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=chat_cache:10m max_size=500m inactive=60m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Upstream with shared memory zone for 'resolve'
    upstream chat_api {
        # define shared memory zone so 'resolve' is allowed
        zone chat_api 64k;
        ip_hash;
        server api1:8000 resolve;
        server api2:8000 resolve;
        server api3:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Add stub_status endpoint for Nginx metrics
        location /stub_status {
            stub_status;
            # Only allow access from internal network
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        location / {
            proxy_pass http://chat_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_cache         chat_cache;
            proxy_cache_valid   200 302 10m;
            proxy_cache_valid   404      1m;
        }
    }
}
